name: Public content and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:public -- --history
      - run: choco install ffmpeg --yes --no-progress
      - run: npm test
      - run: npm run check:public -- --build
