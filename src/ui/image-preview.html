<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>TopMediai Image Results</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif;
      --bg: light-dark(#fff, #191919); --surface: light-dark(#f5f5f4, #242424);
      --ink: light-dark(#222, #f4f4f2); --muted: light-dark(#666, #b5b5b0); --border: light-dark(#e1e1dd, #3a3a36); }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; color: var(--ink); background: var(--bg); }
    header { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    h1 { font-size: 18px; margin: 0; font-weight: 650; }
    #task-status { color: var(--muted); margin: 0; }
    #notice { margin: 0 0 14px; color: var(--muted); }
    #notice:empty { display: none; }
    #gallery { display: grid; gap: 16px; }
    #gallery.multiple { grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); }
    article { min-width: 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .stage { position: relative; display: grid; place-items: center; min-height: 240px; background: var(--surface); }
    img { display: block; width: 100%; max-height: 480px; object-fit: contain; }
    img[hidden] { display: none; }
    .placeholder { padding: 36px 20px; text-align: center; color: var(--muted); }
    .placeholder[hidden] { display: none; }
    .loading::before { content: ''; display: block; margin: 0 auto 12px; width: 22px; height: 22px;
      border: 2px solid var(--border); border-top-color: var(--muted); border-radius: 50%; animation: spin 1s linear infinite; }
    footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; }
    .image-status { margin: 0; font-size: 12px; color: var(--muted); }
    .actions { display: flex; gap: 12px; align-items: center; }
    button, a { font: inherit; color: inherit; }
    a { text-underline-offset: 3px; }
    button { padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; }
    button[hidden] { display: none; }
    button:focus-visible, a:focus-visible { outline: 2px solid #709ad6; outline-offset: 3px; }
    .manual-url { padding: 0 14px 12px; font-size: 12px; overflow-wrap: anywhere; user-select: text; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .loading::before { animation: none; } }
    @media (max-width: 480px) { body { padding: 12px; } img { max-height: 440px; } }
  </style>
</head>
<body>
  <header><h1>Image Results</h1><p id="task-status" role="status" aria-live="polite">Reading results…</p></header>
  <p id="notice" role="status" aria-live="polite"></p>
  <main id="gallery" aria-label="Generated images"></main>
  <script type="module">/* IMAGE_PREVIEW_SCRIPT */</script>
</body>
</html>
